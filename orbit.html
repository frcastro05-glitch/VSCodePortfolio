<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Moon Orbit</title>
    <link rel="stylesheet" type="text/css" href="orbitstyle.css">
</head>

<body>
    <div class="space">
        <div class="earth"></div>
        <div class="orbit">
            <div class="moon"></div>
        </div>
    </div>
    <div class="soundtrack-controls">
        <audio id="soundtrack" preload="none" aria-label="Soundtrack for the page">
            <source src="soundreality-space-drone-599272.mp3" type="audio/mpeg">
        </audio>
        <button class="audio-toggle" type="button" aria-label="Play soundtrack" aria-pressed="false" title="Play soundtrack">
            <span aria-hidden="true">&#9654;</span>
        </button>
    </div>
    <script src="orbit.js"></script>
</body>

</html>
